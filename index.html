<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ကလေးလေး အကို့ကို ပြန်ချစ်နိုင်မလား 💕</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pyidaungsu', 'Myanmar Text', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #ff758c 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
            padding: 20px;
            position: relative;
        }
        
        /* Music Toggle Button Style */
        .music-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.8);
            border: 2px solid #ff4d6d;
            border-radius: 50px;
            padding: 8px 15px;
            cursor: pointer;
            font-size: 14px;
            color: #c9184a;
            font-weight: bold;
            z-index: 100;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* Falling Hearts Background Animation */
        .heart-fall {
            position: absolute;
            top: -10vh;
            font-size: 20px;
            color: rgba(255, 255, 255, 0.7);
            user-select: none;
            z-index: 1;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(-10vh) translateX(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) translateX(50px) rotate(360deg); opacity: 0; }
        }

        .container {
            max-width: 400px;
            width: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.85);
            padding: 30px 20px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(214, 51, 132, 0.2);
            backdrop-filter: blur(5px);
        }
        .illustration {
            width: 150px;
            height: 150px;
            margin-bottom: 20px;
            object-fit: cover;
            border-radius: 50%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            background: white;
            border: 4px solid #ff4d6d;
        }
        h1 {
            font-size: 21px;
            color: #c9184a;
            margin-bottom: 25px;
            line-height: 1.5;
            font-weight: bold;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            position: relative;
            min-height: 80px;
            width: 100%;
        }
        button.action-btn {
            padding: 12px 28px;
            font-size: 18px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        #yesBtn {
            background-color: #ff4d6d;
            color: white;
            z-index: 2;
        }
        #noBtn {
            background-color: #adb5bd;
            color: white;
            position: relative;
        }
        #pleadText {
            margin-top: 15px;
            font-size: 15px;
            color: #d63384;
            height: 30px;
            font-weight: 600;
        }
        .success-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            max-width: 400px;
            width: 100%;
            z-index: 10;
            background: rgba(255, 255, 255, 0.9);
            padding: 30px 20px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(214, 51, 132, 0.2);
        }
        .success-screen h1 {
            font-size: 26px;
            color: #ff007f;
            animation: bounce 1s infinite alternate;
            margin-bottom: 15px;
        }
        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-8px); }
        }

        /* Romantic Modal Popup */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            max-width: 320px;
            width: 90%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            animation: popUp 0.3s ease;
        }
        @keyframes popUp {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .modal-content h3 {
            color: #d63384;
            margin-bottom: 10px;
            font-size: 20px;
        }
        .modal-content p {
            color: #590d22;
            font-size: 15px;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .modal-content button {
            background: #ff4d6d;
            color: white;
            padding: 8px 20px;
            font-size: 16px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Background Music (Romantic Instrumental) -->
    <audio id="bgMusic" loop>
        <source src="https://actions.google.com/sounds/v1/ambiences/romantic_music.ogg" type="audio/ogg">
    </audio>

    <!-- Music Control Button -->
    <button class="music-btn" id="musicBtn" onclick="toggleMusic()">🎵 သီချင်းဖွင့်မည်</button>

    <!-- Falling Hearts Container -->
    <div id="heartsContainer"></div>

    <div class="container" id="mainContainer">
        <svg class="illustration" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <circle cx="100" cy="100" r="100" fill="#fff0f3"/>
            <g transform="translate(40, 35)">
                <path d="M60,20 C50,5 30,5 20,20 C10,35 20,55 60,85 C100,55 110,35 100,20 C90,5 70,5 60,20 Z" fill="#ff4d6d" opacity="0.8"/>
                <circle cx="60" cy="50" r="25" fill="#ffdbac"/>
                <path d="M45,45 Q60,35 75,45" fill="none" stroke="#5c4033" stroke-width="3" stroke-linecap="round"/>
                <circle cx="52" cy="50" r="3" fill="#333"/>
                <circle cx="68" cy="50" r="3" fill="#333"/>
                <path d="M56,58 Q60,63 64,58" fill="none" stroke="#d63384" stroke-width="2.5" stroke-linecap="round"/>
                <rect x="48" y="75" width="24" height="35" rx="8" fill="#ff758c"/>
                <circle cx="85" cy="80" r="10" fill="#ff6b6b"/>
                <circle cx="95" cy="70" r="8" fill="#ffa8a8"/>
                <circle cx="95" cy="90" r="8" fill="#ff8787"/>
                <line x1="75" y1="95" x2="88" y2="85" stroke="#5c4033" stroke-width="3"/>
            </g>
        </svg>
        
        <h1>ကလေးလေး... အကို့ရဲ့အချစ်ကို လက်ခံပြီး ပြန်ချစ်နိုင်မလား 💕</h1>
        <div class="btn-group" id="btnGroup">
            <button id="yesBtn" class="action-btn" onclick="showLovePopup()">Yes 🥰</button>
            <button id="noBtn" class="action-btn" onclick="sayNo()">No 😢</button>
        </div>
        <div id="pleadText"></div>
    </div>

    <!-- Romantic Modal Popup -->
    <div class="modal" id="loveModal">
        <div class="modal-content">
            <h3>ရင်ခုန်သံအစစ်ပါ 💖</h3>
            <p>မင်းက ကိုယ့်ရဲ့ တစ်ဦးတည်းသော အချစ်ဆုံးလေးပါပဲ ကလေးရယ်... 🥰</p>
            <button onclick="goToSuccess()">ပျော်စရာလေးတွေ ကြည့်မယ် ✨</button>
        </div>
    </div>

    <div class="success-screen" id="successScreen">
        <svg class="illustration" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <circle cx="100" cy="100" r="100" fill="#fff0f3"/>
            <g transform="translate(30, 30)">
                <path d="M70,15 C55,-2 30,-2 15,15 C0,32 10,55 70,95 C130,55 140,32 125,15 C110,-2 85,-2 70,15 Z" fill="#ff4d6d" opacity="0.7"/>
                <circle cx="55" cy="65" r="22" fill="#ffdbac"/>
                <circle cx="85" cy="65" r="22" fill="#ffdbac"/>
                <path d="M68,63 Q72,67 76,63" fill="none" stroke="#d63384" stroke-width="3" stroke-linecap="round"/>
                <path d="M35,95 Q55,80 70,95 Q85,80 105,95 Z" fill="#ff4d6d"/>
            </g>
        </svg>
        
        <h1>ယေးးး! အကို့ကိုချစ်တယ်ဆိုတာ သိပြီးသားပါဗျာ 😍💖</h1>
        <p style="font-size: 16px; color: #590d22; margin-top: 10px; line-height: 1.5;">အမြဲတမ်း ပျော်ရွှင်ရအောင် အကို ထိန်းသိမ်းပေးသွားပါမယ် ချစ်ရဆုံးရေ 🥰</p>
    </div>

    <script>
        const bgMusic = document.getElementById('bgMusic');
        const musicBtn = document.getElementById('musicBtn');
        let isMusicPlaying = false;

        function toggleMusic() {
            if (isMusicPlaying) {
                bgMusic.pause();
                musicBtn.innerText = "🎵 သီချင်းဖွင့်မည်";
                isMusicPlaying = false;
            } else {
                bgMusic.play().then(() => {
                    musicBtn.innerText = "🔇 သီချင်းပိတ်မည်";
                    isMusicPlaying = true;
                }).catch(e => {
                    console.log("Audio play blocked:", e);
                });
            }
        }

        // Auto play music on first user interaction if blocked by browser
        document.body.addEventListener('click', function() {
            if (!isMusicPlaying) {
                bgMusic.play().then(() => {
                    musicBtn.innerText = "🔇 သီချင်းပိတ်မည်";
                    isMusicPlaying = true;
                }).catch(e => {});
            }
        }, { once: true });

        // Generate Falling Hearts Automatically
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-fall');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
            heart.style.fontSize = (Math.random() * 15 + 15) + 'px';
            document.getElementById('heartsContainer').appendChild(heart);
            
            setTimeout(() => {
                heart.remove();
            }, 6000);
        }
        setInterval(createHeart, 400);

        const pleadings = [
            "စဉ်းစားပါဦးနော်... အကို့ကို လှည့်တောင် မကြည့်ဘူးလား 🥺",
            "နောက်တစ်ခါ ထပ်စမ်းကြည့်ပါဦး ကလေးရယ် 😭",
            "အကို့ကို ဒီလောက်တောင် ရက်စက်ရလား ဟင် 💔",
            "မလုပ်နဲ့လေ နော် နော်... 😣",
            "ဒီခလုတ်ကို နှိပ်လို့ မရဘူးလေ ဗျာ 😜",
            "အကို့ကို သနားကွင်းလေး ဘက်ကနေ စဉ်းစားပေးပါဦး 😿",
            "တောင်းပန်ပါတယ်ဗျာ... Yes ကိုပဲ နှိပ်လိုက်ပါတော့နော် 💖"
        ];

        let noClickCount = 0;
        let yesBtnSize = 1;

        function sayNo() {
            noClickCount++;
            
            const randomIndex = Math.floor(Math.random() * pleadings.length);
            document.getElementById('pleadText').innerText = pleadings[randomIndex];

            yesBtnSize += 0.3;
            const yesBtn = document.getElementById('yesBtn');
            yesBtn.style.transform = `scale(${yesBtnSize})`;

            if (yesBtnSize > 4) {
                document.getElementById('yesBtn').style.position = 'fixed';
                document.getElementById('yesBtn').style.width = '100vw';
                document.getElementById('yesBtn').style.height = '100vh';
                document.getElementById('yesBtn').style.top = '0';
                document.getElementById('yesBtn').style.left = '0';
                document.getElementById('yesBtn').style.borderRadius = '0';
                document.getElementById('yesBtn').style.fontSize = '32px';
                document.getElementById('noBtn').style.display = 'none';
            } else {
                const noBtn = document.getElementById('noBtn');
                const randomX = (Math.random() - 0.5) * 120;
                const randomY = (Math.random() - 0.5) * 120;
                noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
            }
        }

        function showLovePopup() {
            document.getElementById('loveModal').style.display = 'flex';
        }

        function goToSuccess() {
            document.getElementById('loveModal').style.display = 'none';
            document.getElementById('mainContainer').style.display = 'none';
            document.getElementById('successScreen').style.display = 'flex';
        }
    </script>
</body>
</html>
