<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ကလေးလေး ကိုယ့်ကို ပြန်ချစ်နိုင်မလား</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pyidaungsu', 'Myanmar Text', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            width: 100%;
            z-index: 10;
        }
        h1 {
            font-size: 24px;
            color: #d63384;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            position: relative;
            min-height: 80px;
        }
        button {
            padding: 12px 24px;
            font-size: 18px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        #yesBtn {
            background-color: #ff4d6d;
            color: white;
            z-index: 2;
        }
        #noBtn {
            background-color: #adb5bd;
            color: white;
            position: relative;
        }
        #pleadText {
            margin-top: 30px;
            font-size: 16px;
            color: #c9184a;
            height: 30px;
            font-weight: 600;
        }
        .success-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .success-screen h1 {
            font-size: 32px;
            color: #ff007f;
            animation: bounce 1s infinite alternate;
        }
        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <h1>ကလေးလေး အကို့ရဲ့အချစ်ကိုလက်ခံပြီး ပြန်ချစ်နိုင်မလား 💕</h1>
        <div class="btn-group" id="btnGroup">
            <button id="yesBtn" onclick="sayYes()">လက်ခံပါတယ် 🥰</button>
            <button id="noBtn" onclick="sayNo()">ငင်းမယ် 😢</button>
        </div>
        <div id="pleadText"></div>
    </div>

    <div class="success-screen" id="successScreen">
        <h1>ယေးးး! ကိုယ့်ကိုချစ်တယ်ဆိုတာ သိပြီးသားပါရှင် 😍💖</h1>
        <p style="font-size: 18px; color: #590d22; margin-top: 15px;">အမြဲတမ်း ပျော်ရွှင်ရအောင် ထိန်းသိမ်းပေးသွားပါမယ် ချစ်ရဆုံးရေ 🥰</p>
    </div>

    <script>
        const pleadings = [
            "စဉ်းစားပါဦးနော်... လှည့်တောင် မကြည့်ဘူးလား 🥺",
            "နောက်တစ်ခါ ထပ်စမ်းကြည့်ပါဦး ကလေးရယ် 😭",
            "ငါ့ကို ဒီလောက်တောင် ရက်စက်ရလား ဟင် 💔",
            "မလုပ်နဲ့လေ နော် နော်... 😣",
            "ဒီခလုတ်ကို နှိပ်လို့ မရဘူးလေ 😜",
            "သနားကွင်းလေး ဘက်ကနေ စဉ်းစားပေးပါဦး 😿",
            "တောင်းပန်ပါတယ်ဗျာ... Yes ကိုပဲ နှိပ်လိုက်ပါတော့နော် 💖"
        ];

        let noClickCount = 0;
        let yesBtnSize = 1;

        function sayNo() {
            noClickCount++;
            
            // Show plead text
            const randomIndex = Math.floor(Math.random() * pleadings.length);
            document.getElementById('pleadText').innerText = pleadings[randomIndex];

            // Increase Yes button size
            yesBtnSize += 0.3;
            const yesBtn = document.getElementById('yesBtn');
            yesBtn.style.transform = `scale(${yesBtnSize})`;

            // If Yes button becomes too big, cover screen
            if (yesBtnSize > 4) {
                document.getElementById('yesBtn').style.position = 'fixed';
                document.getElementById('yesBtn').style.width = '100vw';
                document.getElementById('yesBtn').style.height = '100vh';
                document.getElementById('yesBtn').style.top = '0';
                document.getElementById('yesBtn').style.left = '0';
                document.getElementById('yesBtn').style.borderRadius = '0';
                document.getElementById('yesBtn').style.fontSize = '32px';
                document.getElementById('noBtn').style.display = 'none';
            } else {
                // Move No button randomly
                const noBtn = document.getElementById('noBtn');
                const randomX = (Math.random() - 0.5) * 150;
                const randomY = (Math.random() - 0.5) * 150;
                noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
            }
        }

        function sayYes() {
            document.getElementById('mainContainer').style.display = 'none';
            document.getElementById('successScreen').style.display = 'flex';
        }
    </script>
</body>
</html>
