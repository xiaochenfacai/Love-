<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ကလေးလေး အကို့ကို ပြန်ချစ်နိုင်မလား</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pyidaungsu', 'Myanmar Text', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            width: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .illustration {
            width: 160px;
            height: 160px;
            margin-bottom: 20px;
            object-fit: cover;
            border-radius: 50%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            background: white;
            border: 4px solid #ffffff;
        }
        h1 {
            font-size: 22px;
            color: #d63384;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            position: relative;
            min-height: 80px;
            width: 100%;
        }
        button {
            padding: 12px 28px;
            font-size: 18px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        #yesBtn {
            background-color: #ff4d6d;
            color: white;
            z-index: 2;
        }
        #noBtn {
            background-color: #adb5bd;
            color: white;
            position: relative;
        }
        #pleadText {
            margin-top: 25px;
            font-size: 16px;
            color: #c9184a;
            height: 30px;
            font-weight: 600;
        }
        .success-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            max-width: 400px;
            width: 100%;
        }
        .success-screen h1 {
            font-size: 28px;
            color: #ff007f;
            animation: bounce 1s infinite alternate;
            margin-bottom: 15px;
        }
        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <!-- ယောက်ျားလေး ပန်းစည်းနဲ့ ချစ်ခွင့်ပန်တဲ့ ချစ်စရာ ပုံ (Reliable SVG Graphic) -->
        <svg class="illustration" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <circle cx="100" cy="100" r="100" fill="#fff5f6"/>
            <!-- Cute Proposing Character Art -->
            <g transform="translate(40, 35)">
                <!-- Heart Floating -->
                <path d="M60,20 C50,5 30,5 20,20 C10,35 20,55 60,85 C100,55 110,35 100,20 C90,5 70,5 60,20 Z" fill="#ff4d6d" opacity="0.8"/>
                <!-- Character Body & Head -->
                <circle cx="60" cy="50" r="25" fill="#ffdbac"/>
                <path d="M45,45 Q60,35 75,45" fill="none" stroke="#5c4033" stroke-width="3" stroke-linecap="round"/>
                <circle cx="52" cy="50" r="3" fill="#333"/>
                <circle cx="68" cy="50" r="3" fill="#333"/>
                <!-- Cute Smile -->
                <path d="M56,58 Q60,63 64,58" fill="none" stroke="#d63384" stroke-width="2.5" stroke-linecap="round"/>
                <!-- Body -->
                <rect x="48" y="75" width="24" height="35" rx="8" fill="#4dabf7"/>
                <!-- Bouquet of Flowers -->
                <circle cx="85" cy="80" r="10" fill="#ff6b6b"/>
                <circle cx="95" cy="70" r="8" fill="#ffa8a8"/>
                <circle cx="95" cy="90" r="8" fill="#ff8787"/>
                <line x1="75" y1="95" x2="88" y2="85" stroke="#5c4033" stroke-width="3"/>
            </g>
        </svg>
        
        <h1>ကလေးလေး အကို့ရဲ့အချစ်ကိုလက်ခံပြီး ပြန်ချစ်နိုင်မလား 💕</h1>
        <div class="btn-group" id="btnGroup">
            <button id="yesBtn" onclick="sayYes()">Yes 🥰</button>
            <button id="noBtn" onclick="sayNo()">No 😢</button>
        </div>
        <div id="pleadText"></div>
    </div>

    <div class="success-screen" id="successScreen">
        <!-- ချစ်စရာ စုံတွဲ ချစ်တင်းနှီးနှောတဲ့ ပုံ (Reliable SVG Graphic) -->
        <svg class="illustration" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <circle cx="100" cy="100" r="100" fill="#fff0f3"/>
            <g transform="translate(30, 30)">
                <!-- Big Love Hearts Background -->
                <path d="M70,15 C55,-2 30,-2 15,15 C0,32 10,55 70,95 C130,55 140,32 125,15 C110,-2 85,-2 70,15 Z" fill="#ff8787" opacity="0.6"/>
                <!-- Couple Hugging/Kissing Graphic -->
                <circle cx="55" cy="65" r="22" fill="#ffdbac"/>
                <circle cx="85" cy="65" r="22" fill="#ffdbac"/>
                <!-- Kissing expression -->
                <path d="M68,63 Q72,67 76,63" fill="none" stroke="#d63384" stroke-width="3" stroke-linecap="round"/>
                <!-- Bodies locked -->
                <path d="M35,95 Q55,80 70,95 Q85,80 105,95 Z" fill="#ff4d6d"/>
            </g>
        </svg>
        
        <h1>ယေးးး! အကို့ကိုချစ်တယ်ဆိုတာ သိပြီးသားပါဗျာ 😍💖</h1>
        <p style="font-size: 18px; color: #590d22; margin-top: 10px;">အမြဲတမ်း ပျော်ရွှင်ရအောင် အကို ထိန်းသိမ်းပေးသွားပါမယ် ချစ်ရဆုံးရေ 🥰</p>
    </div>

    <script>
        const pleadings = [
            "စဉ်းစားပါဦးနော်... အကို့ကို လှည့်တောင် မကြည့်ဘူးလား 🥺",
            "နောက်တစ်ခါ ထပ်စမ်းကြည့်ပါဦး ကလေးရယ် 😭",
            "အကို့ကို ဒီလောက်တောင် ရက်စက်ရလား ဟင် 💔",
            "မလုပ်နဲ့လေ နော် နော်... 😣",
            "ဒီခလုတ်ကို နှိပ်လို့ မရဘူးလေ ဗျာ 😜",
            "အကို့ကို သနားကွင်းလေး ဘက်ကနေ စဉ်းစားပေးပါဦး 😿",
            "တောင်းပန်ပါတယ်ဗျာ... Yes ကိုပဲ နှိပ်လိုက်ပါတော့နော် 💖"
        ];

        let noClickCount = 0;
        let yesBtnSize = 1;

        function sayNo() {
            noClickCount++;
            
            // Show plead text
            const randomIndex = Math.floor(Math.random() * pleadings.length);
            document.getElementById('pleadText').innerText = pleadings[randomIndex];

            // Increase Yes button size
            yesBtnSize += 0.3;
            const yesBtn = document.getElementById('yesBtn');
            yesBtn.style.transform = `scale(${yesBtnSize})`;

            // If Yes button becomes too big, cover screen
            if (yesBtnSize > 4) {
                document.getElementById('yesBtn').style.position = 'fixed';
                document.getElementById('yesBtn').style.width = '100vw';
                document.getElementById('yesBtn').style.height = '100vh';
                document.getElementById('yesBtn').style.top = '0';
                document.getElementById('yesBtn').style.left = '0';
                document.getElementById('yesBtn').style.borderRadius = '0';
                document.getElementById('yesBtn').style.fontSize = '32px';
                document.getElementById('noBtn').style.display = 'none';
            } else {
                // Move No button randomly
                const noBtn = document.getElementById('noBtn');
                const randomX = (Math.random() - 0.5) * 120;
                const randomY = (Math.random() - 0.5) * 120;
                noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
            }
        }

        function sayYes() {
            document.getElementById('mainContainer').style.display = 'none';
            document.getElementById('successScreen').style.display = 'flex';
        }
    </script>
</body>
</html>
